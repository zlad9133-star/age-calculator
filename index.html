<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حاسبة العمر</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Tahoma", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 25px;
        padding: 40px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
      }

      h1 {
        color: #764ba2;
        margin-bottom: 30px;
      }

      .input-group {
        margin-bottom: 25px;
        text-align: right;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 15px;
        border: 2px solid #ddd;
        border-radius: 15px;
        font-size: 1.1rem;
      }

      input:focus {
        border-color: #764ba2;
        outline: none;
      }

      button {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 30px;
        font-size: 1.1rem;
        cursor: pointer;
        width: 100%;
      }

      .result {
        margin-top: 30px;
        padding: 20px;
        background: #f0f0f0;
        border-radius: 15px;
        font-size: 1.2rem;
        line-height: 2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📅 حاسبة العمر</h1>

      <div class="input-group">
        <label>📆 تاريخ ميلادك:</label>
        <input type="date" id="birthdate" />
      </div>

      <button onclick="calculateAge()">احسب عمري 🎂</button>

      <div class="result" id="result">⏳ انتظر إدخال تاريخ ميلادك</div>
    </div>

    <script>
      function calculateAge() {
        let birthdateInput = document.getElementById("birthdate");
        let birthdateValue = birthdateInput.value;

        if (birthdateValue === "") {
          document.getElementById("result").innerHTML =
            "⚠️ من فضلك اختر تاريخ ميلادك";
          return;
        }

        let birthDate = new Date(birthdateValue);
        let today = new Date();

        if (birthDate > today) {
          document.getElementById("result").innerHTML =
            "❌ تاريخ الميلاد لا يمكن أن يكون في المستقبل!";
          return;
        }

        let ageYears = today.getFullYear() - birthDate.getFullYear();
        let ageMonths = today.getMonth() - birthDate.getMonth();
        let ageDays = today.getDate() - birthDate.getDate();

        if (ageDays < 0) {
          ageMonths--;
          let lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
          ageDays += lastMonth.getDate();
        }

        if (ageMonths < 0) {
          ageYears--;
          ageMonths += 12;
        }

        document.getElementById("result").innerHTML = `
                🎉 عمرك بالضبط:
                <br><br>
                📅 ${ageYears} سنة
                <br>
                📆 ${ageMonths} شهر
                <br>
                📍 ${ageDays} يوم
                <br><br>
                ✨ إجمالي أيام حياتك تقريباً: ${ageYears * 365 + ageMonths * 30 + ageDays} يوم
            `;
      }
    </script>
  </body>
</html>
